<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunrise Interiors - Live Voice Agent Demo</title>
    <!-- Modern Premium Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-hover: rgba(255, 255, 255, 0.06);
            --primary: #f59e0b; /* Warm Gold */
            --primary-glow: rgba(245, 158, 11, 0.35);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1;
            transition: transform 0.3s ease;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-text {
            font-size: 1.2rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--primary);
            margin-bottom: 6px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #f8fafc, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            text-align: center;
            font-size: 0.95rem;
            margin-bottom: 35px;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 25px;
            position: relative;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input, select {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 16px 20px;
            color: var(--text-main);
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .btn-call {
            width: 100%;
            background: var(--primary);
            color: #0f172a;
            border: none;
            border-radius: 12px;
            padding: 18px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 20px var(--primary-glow);
        }

        .btn-call:hover {
            transform: translateY(-2px);
            background: #fbbf24;
            box-shadow: 0 8px 30px var(--primary-glow);
        }

        .btn-call:disabled {
            background: var(--glass-border);
            color: var(--text-muted);
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* Live Status UI */
        .status-container {
            display: none;
            margin-top: 30px;
            border-top: 1px solid var(--glass-border);
            padding-top: 25px;
        }

        .status-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--primary);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.5; }
        }

        .transcript-box {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            height: 250px;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .message.agent {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.2);
            color: #fef08a;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.user {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .wave-container {
            display: flex;
            align-items: center;
            gap: 3px;
            height: 20px;
        }

        .wave-bar {
            width: 3px;
            height: 100%;
            background-color: var(--primary);
            border-radius: 3px;
            animation: wave 1.2s ease-in-out infinite;
        }

        .wave-bar:nth-child(2) { animation-delay: 0.2s; }
        .wave-bar:nth-child(3) { animation-delay: 0.4s; }
        .wave-bar:nth-child(4) { animation-delay: 0.6s; }

        @keyframes wave {
            0%, 100% { transform: scaleY(0.3); }
            50% { transform: scaleY(1); }
        }

        /* Background blur circles */
        .blur-circle {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            opacity: 0.2;
        }

        .circle-1 {
            background: #f59e0b;
            top: -50px;
            left: -100px;
        }

        .circle-2 {
            background: #4f46e5;
            bottom: -50px;
            right: -100px;
        }
    </style>
</head>
<body>
    <div class="blur-circle circle-1"></div>
    <div class="blur-circle circle-2"></div>

    <div class="container">
        <div class="logo-container">
            <div class="logo-text">Sunrise Interiors</div>
            <h1>Live Voice Agent</h1>
            <p class="subtitle">Experience an instant callback from our design coordinator, Zara. Enter your number below to receive a call.</p>
        </div>

        <form id="callForm" onsubmit="handleCallSubmit(event)">
            <div class="input-group">
                <label for="phoneNumber">Phone Number (with Country Code)</label>
                <input type="tel" id="phoneNumber" placeholder="e.g. +919876543210" required>
            </div>
            <div class="input-group">
                <label for="languageSelect">Preferred Language</label>
                <select id="languageSelect">
                    <option value="en-IN">English (India)</option>
                    <option value="hi">Hindi (हिन्दी)</option>
                    <option value="hi-Latn">Hinglish (Hindi/English mix)</option>
                </select>
            </div>
            <button type="submit" id="submitBtn" class="btn-call">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                Call Me Now
            </button>
        </form>

        <div id="statusContainer" class="status-container">
            <div class="status-header">
                <div class="status-badge">
                    <div class="pulse-dot"></div>
                    <span id="callStatusText">Calling...</span>
                </div>
                <div class="wave-container" id="voiceWave" style="display: none;">
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                </div>
            </div>
            <!-- Meeting Appointed Indicator -->
            <div id="meetingAppointedBadge" style="display: none; margin-bottom: 15px; padding: 12px; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); border-radius: 12px; color: #34d399; font-size: 0.9rem; font-weight: 600; text-align: center; gap: 8px; align-items: center; justify-content: center;">
                <span style="width: 8px; height: 8px; border-radius: 50%; background: #10b981; display: inline-block;"></span>
                Your Design Consultation is Appointed!
            </div>
            <div class="transcript-box" id="transcriptBox">
                <!-- Messages will appear here -->
            </div>
        </div>
    </div>

    <script>
        let pollInterval = null;
        let callSid = null;

        async function handleCallSubmit(event) {
            event.preventDefault();
            const phoneInput = document.getElementById('phoneNumber');
            const languageSelect = document.getElementById('languageSelect');
            const submitBtn = document.getElementById('submitBtn');
            const statusContainer = document.getElementById('statusContainer');
            const callStatusText = document.getElementById('callStatusText');
            const voiceWave = document.getElementById('voiceWave');
            const transcriptBox = document.getElementById('transcriptBox');

            const phone = phoneInput.value.trim();
            const language = languageSelect ? languageSelect.value : 'en-IN';
            if (!phone) return;

            // Reset UI
            submitBtn.disabled = true;
            submitBtn.innerText = 'Connecting...';
            statusContainer.style.display = 'block';
            callStatusText.innerText = 'Initiating call...';
            voiceWave.style.display = 'none';
            transcriptBox.innerHTML = '';
            const badge = document.getElementById('meetingAppointedBadge');
            if (badge) badge.style.display = 'none';

            try {
                const formData = new FormData();
                formData.append('phone_number', phone);
                formData.append('language', language);

                const response = await fetch('/api/make-call', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok && data.call_sid) {
                    callSid = data.call_sid;
                    callStatusText.innerText = 'Calling your phone...';
                    // Start polling the transcript endpoint
                    startPolling(callSid);
                } else {
                    alert(data.error || 'Failed to initiate call. Make sure localtunnel is running and BASE_URL is set.');
                    resetCallButton();
                }
            } catch (err) {
                console.error(err);
                alert('Connection error. Is backend server running?');
                resetCallButton();
            }
        }

        function startPolling(sid) {
            const callStatusText = document.getElementById('callStatusText');
            const voiceWave = document.getElementById('voiceWave');
            const transcriptBox = document.getElementById('transcriptBox');
            let lastLength = 0;

            if (pollInterval) clearInterval(pollInterval);

            pollInterval = setInterval(async () => {
                try {
                    const response = await fetch(`/api/transcript/${sid}`);
                    const data = await response.json();

                    if (data.status) {
                        callStatusText.innerText = data.status + '...';
                        
                        if (data.status === 'Active') {
                            voiceWave.style.display = 'flex';
                        } else if (data.status === 'Completed' || data.status === 'Error') {
                            voiceWave.style.display = 'none';
                            clearInterval(pollInterval);
                            resetCallButton();
                        }
                    }

                    if (data.meeting_appointed) {
                        const badge = document.getElementById('meetingAppointedBadge');
                        if (badge) badge.style.display = 'flex';
                    }

                    if (data.transcript && data.transcript.length > lastLength) {
                        // Render new messages
                        for (let i = lastLength; i < data.transcript.length; i++) {
                            const msg = data.transcript[i];
                            const msgDiv = document.createElement('div');
                            msgDiv.classList.add('message', msg.speaker.toLowerCase() === 'zara' ? 'agent' : 'user');
                            msgDiv.innerHTML = `<strong>${msg.speaker}:</strong> ${msg.text}`;
                            transcriptBox.appendChild(msgDiv);
                        }
                        lastLength = data.transcript.length;
                        // Scroll to bottom
                        transcriptBox.scrollTop = transcriptBox.scrollHeight;
                    }
                } catch (e) {
                    console.error('Polling error:', e);
                }
            }, 1000);
        }

        function resetCallButton() {
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = false;
            submitBtn.innerHTML = `
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                Call Me Again
            `;
        }
    </script>
</body>
</html>
